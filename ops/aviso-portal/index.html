<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Nüprotec se mudó</title>
<style>
  :root { color-scheme: light dark; --tinta:#0f172a; --suave:#475569; --fondo:#f8fafc; --papel:#fff; --borde:#e2e8f0; --azul:#1e3a8a; }
  @media (prefers-color-scheme: dark) {
    :root { --tinta:#e8eef7; --suave:#94a3b8; --fondo:#0b1220; --papel:#131c2e; --borde:#253048; --azul:#93b4f7; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px;
         background:var(--fondo); color:var(--tinta);
         font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { width:100%; max-width:34rem; background:var(--papel); border:1px solid var(--borde);
         border-radius:16px; padding:32px 28px; }
  h1 { margin:0 0 4px; font-size:1.5rem; letter-spacing:-.02em; }
  p { margin:.6rem 0 0; color:var(--suave); }
  a.boton { display:inline-block; margin-top:22px; padding:12px 20px; border-radius:10px;
            background:var(--azul); color:#fff; font-weight:600; text-decoration:none; }
  @media (prefers-color-scheme: dark) { a.boton { color:#0b1220; } }
  code { font-size:.85em; color:var(--suave); word-break:break-all; }
</style>
</head>
<body>
<main>
  <h1>Nüprotec se mudó</h1>
  <p>Esta dirección quedó atrás. El dashboard vive ahora en un servidor propio en Chile:
     más rápido, y con los datos en una sola base.</p>
  <a class="boton" href="https://nuprotec.melioraadvisory.cl/Nuprotecv3">Ir al dashboard</a>
  <p style="margin-top:20px"><code>nuprotec.melioraadvisory.cl/Nuprotecv3</code></p>
</main>
</body>
</html>
